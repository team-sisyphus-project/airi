worker_processes  auto;

# NOTICE:
# Runtime rootfs is read-only (gVisor sandbox); only /tmp is writable.
# The pid file and every nginx-managed temp dir are redirected under /tmp
# so the worker/master processes never attempt to write into /var/run or
# /var/cache/nginx, both of which live on the read-only image layer.
# Root cause: default nginx.conf assumes a writable /var tree.
# Source: nginx:1.27-alpine default /etc/nginx/nginx.conf.
# Removal condition: platform ships a writable /var tree, or nginx adds a
# fully in-memory temp-path mode.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Platform captures container output from stdout/stderr; file-based
    # logs would require a writable /var/log/nginx that does not exist
    # on the read-only rootfs.
    access_log  /dev/stdout;
    error_log   /dev/stderr;

    sendfile        on;
    keepalive_timeout  65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # docker-entrypoint.sh renders default.conf.template into this
    # directory (NGINX_ENVSUBST_OUTPUT_DIR=/tmp/conf.d) at container
    # start, substituting $PORT with the platform-injected value. The
    # rendered file cannot live under /etc/nginx/conf.d because that
    # path is read-only at runtime.
    include /tmp/conf.d/*.conf;
}
